<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant Sam</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f0f0f0, #d9d9d9);
        }
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        .hero-content {
            color: #fff;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.2);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateZ(50px);
            transition: transform 0.5s;
        }
        .hero-content:hover {
            transform: translateZ(80px);
        }
        h1 {
            font-size: 3rem;
            margin: 0;
        }
        p {
            font-size: 1.25rem;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="hero">
        <div class="hero-content">
            <h1>Welcome to Voice Assistant Sam</h1>
            <p>Your personal assistant to travel smarter.</p>
        </div>
    </div>
    <script>
        // Particle Animation
        const particles = document.querySelector('.particles');
        for (let i = 0; i < 100; i++) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.borderRadius = '50%';
            particle.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
            particle.style.width = `${Math.random() * 5 + 1}px`;
            particle.style.height = particle.style.width;
            particle.style.top = `${Math.random() * 100}vh`;
            particle.style.left = `${Math.random() * 100}vw`;
            particles.appendChild(particle);
            animateParticle(particle);
        }
        function animateParticle(particle) {
            let deltaX = (Math.random() - 0.5) * 2;
            let deltaY = (Math.random() - 0.5) * 2;
            function move() {
                let rect = particle.getBoundingClientRect();
                if (rect.top > window.innerHeight || rect.left > window.innerWidth || rect.left < 0) {
                    particle.remove();
                } else {
                    particle.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    requestAnimationFrame(move);
                }
            }
            move();
        }
    </script>
</body>
</html>
