<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Voice Assistant</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('your-animated-background-image-url') no-repeat center center/cover;
            overflow: hidden;
        }
        .hero h1 {
            font-size: 4rem;
            text-align: center;
        }
        .voice-button {
            position: absolute;
            bottom: 20%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ff4081;
            border: none;
            cursor: pointer;
            font-size: 2rem;
            text-align: center;
            line-height: 100px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to Sam Voice Assistant</h1>
        <button class="voice-button">🎤</button>
    </div>
    <script>
        const button = document.querySelector('.voice-button');
        button.addEventListener('click', () => {
            alert('Voice Assistant Activated!');
            // Your voice assistant activation logic here
        });
    </script>
</body>
</html>
