<!DOCTYPE html>
<html lang="en">
<head>

    <title>Voice Assistant Sam - Landing Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .hero {
            background: url('hero-image.jpg') no-repeat center center/cover;
            height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 2s;
        }

        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.5em;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

        <h1>Welcome to Voice Assistant Sam</h1>
